<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // SPA Fallback for Vercel & static hosting
      var path = window.location.pathname.toLowerCase();
      if (path.includes("/adm") || path.includes("/admin") || path.includes("/frm")) {
        window.location.href = "/?adm";
      } else {
        window.location.href = "/";
      }
    </script>
  </head>
  <body>
  </body>
</html>
